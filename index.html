<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>草野球スコア</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#0f5132">
<meta name="description" content="草野球のスコア入力と成績集計">

<!-- iOS ホーム画面アプリ用 -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="草野球スコア">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="appbar">
  <button id="btn-back" class="bar-btn" hidden aria-label="戻る">‹</button>
  <h1 id="app-title">試合</h1>
  <button id="btn-action" class="bar-btn" hidden></button>
</header>

<div id="backup-banner" hidden></div>

<main id="view"></main>

<nav id="tabbar">
  <button data-nav="games"   class="tab is-active"><span class="ic">⚾</span><span>試合</span></button>
  <button data-nav="players" class="tab"><span class="ic">👥</span><span>メンバー</span></button>
  <button data-nav="stats"   class="tab"><span class="ic">📊</span><span>成績</span></button>
  <button data-nav="settings" class="tab"><span class="ic">⚙️</span><span>設定</span></button>
</nav>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
